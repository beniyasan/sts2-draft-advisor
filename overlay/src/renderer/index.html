<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft Advisor</title><link rel="stylesheet" href="renderer.css"><script src="../../vendor/live2dcubismcore.min.js"></script></head>
<body><main id="app">
  <section class="avatar-panel drag-region"><button id="close" class="no-drag" title="最小化">−</button><div id="avatar" class="avatar">Draft Advisor</div><div id="status">ゲーム接続待ち</div></section>
  <section class="chat-panel"><header class="drag-region"><strong>Draft Advisor</strong><span id="model"></span><button id="clear" class="no-drag" title="チャット履歴を消去">クリア</button><button id="login" class="no-drag">ログイン</button><button id="refresh" class="no-drag">更新</button></header><div id="context" class="context">ゲーム状態を待っています</div><div class="preset-bar no-drag"><select id="preset-select" aria-label="定型文"><option value="">定型文を選択</option></select><button id="preset-use" type="button">挿入</button><input id="preset-name" type="text" placeholder="定型文名"><button id="preset-save" type="button">保存</button><button id="preset-delete" type="button">削除</button></div><div id="messages" class="messages"></div><form id="form"><textarea id="input" rows="2" placeholder="このデッキで何を取るべき？"></textarea><button type="submit">送信</button></form></section>
</main><script src="renderer.js"></script></body></html>
